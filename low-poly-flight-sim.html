<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly 3D Flugsimulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #hud { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; }
        #hud canvas { position: absolute; top: 0; left: 0; }
        #info { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.6); padding: 15px 20px; border-radius: 10px; font-size: 14px; z-index: 101; pointer-events: auto; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        #info h1 { font-size: 18px; margin-bottom: 10px; background: linear-gradient(90deg, #00ff88, #0088ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        #info .controls { margin-top: 10px; font-size: 12px; opacity: 0.8; }
        #pointerLockButton { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #00ff88, #0088ff); color: #000; border: none; padding: 15px 30px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 102; pointer-events: auto; transition: all 0.3s ease; box-shadow: 0 0 20px rgba(0,255,136,0.3); }
        #pointerLockButton:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 30px rgba(0,255,136,0.5); }
        #pointerLockButton:active { transform: translateX(-50%) scale(0.95); }
        #warning { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff0000; font-size: 72px; font-weight: bold; text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; opacity: 0; z-index: 103; pointer-events: none; transition: opacity 0.3s ease; animation: pulse 0.5s ease infinite alternate; }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.1); } }
        #loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0a0a1a, #1a1a2e); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 1000; transition: opacity 0.5s ease; }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .loader { width: 60px; height: 60px; border: 4px solid rgba(0,255,136,0.3); border-top-color: #00ff88; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #00ff88; margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <div id="loading"><div class="loader"></div><p>Generiere Terrain...</p></div>
    <div id="warning">PULL UP</div>
    <div id="info"><h1>Low-Poly Flugsimulation</h1><div class="controls"><strong>Steuerung:</strong><br>W/S: Vor/zurück | A/D: Rollen | Space/C: Steigen/Sinken<br>Shift: Boost | G: Wireframe | 1/2/3: Tag/Abend/Nacht<br>Maus: Blickrichtung | Linksklick: Pointer Lock</div></div>
    <button id="pointerLockButton">Aktiviere Maussteuerung</button>
    <div id="hud"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>

        const CONFIG = {
            CHUNK_SIZE: 64, CHUNK_COUNT: 8, MAX_HEIGHT: 120, OCTAVES: 4, PERSISTENCE: 0.5, LACUNARITY: 2.0, SCALE: 0.05,
            FOV: 75, NEAR: 0.1, FAR: 2000, SHADOW_MAP_SIZE: 2048, WIREFRAME: false,
            SPEED: 0.5, BOOST_MULTIPLIER: 2.5, ROTATION_SPEED: 0.02, GRAVITY: 0.005, LIFT: 0.01, DRAG: 0.99,
            COLLISION_DISTANCE: 20, WARNING_HEIGHT: 30, BOUNCE_STRENGTH: 0.3,
            DAY_COLOR: 0xffffff, SUNSET_COLOR: 0xff8844, NIGHT_COLOR: 0x222244,
            AMBIENT_DAY: 0.4, AMBIENT_SUNSET: 0.3, AMBIENT_NIGHT: 0.1
        };
        let scene, camera, renderer, aircraft;
        let chunks = [];
        let pointerLockActive = false, warningActive = false, currentTimeOfDay = 1, wireframeMode = 0;
        let hudCanvas, hudCtx;
        const aircraftState = {
            position: new THREE.Vector3(0, 100, 0), velocity: new THREE.Vector3(0, 0, 0),
            roll: 0, pitch: 0, yaw: 0, speed: 0, throttle: 0, onGround: false, lastBounce: 0
        };
        const keys = {};
        const mouse = { x: 0, y: 0, dx: 0, dy: 0, down: false };

        class ImprovedNoise {
            constructor(seed = Math.random()) {
                this.seed = seed; this.random = this.seedRandom(seed);
            }
            seedRandom(seed) {
                const m = 0x80000000, a = 1103515245, c = 12345;
                return function() { seed = (a * seed + c) % m; return seed / (m - 1); };
            }
            grad(hash, x, y) {
                const h = hash & 15, u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : 0);
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            noise2D(x, y) {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
                x -= Math.floor(x); y -= Math.floor(y);
                const u = this.fade(x), v = this.fade(y), p = this.perm;
                const A = p[X] + Y, AA = p[A], AB = p[A + 1], B = p[X + 1] + Y, BA = p[B], BB = p[B + 1];
                return this.lerp(v, this.lerp(u, this.grad(p[AA], x, y), this.grad(p[BA], x - 1, y)),
                    this.lerp(u, this.grad(p[AB], x, y - 1), this.grad(p[BB], x - 1, y - 1)));
            }
            get perm() {
                if (!this._perm) {
                    this._perm = [];
                    const p = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
                    for (let i = 0; i < 256; i++) { this._perm[i] = p[i] & 255; this._perm[i + 256] = this._perm[i]; }
                }
                return this._perm;
            }
            fractalNoise(x, y, octaves = 4, persistence = 0.5, lacunarity = 2.0) {
                let total = 0, frequency = 1, amplitude = 1, maxValue = 0;
                for (let i = 0; i < octaves; i++) {
                    total += this.noise2D(x * frequency, y * frequency) * amplitude;
                    maxValue += amplitude; amplitude *= persistence; frequency *= lacunarity;
                }
                return total / maxValue;
            }
        }
        const noiseGen = new ImprovedNoise(42);

        function getHeightColor(height, slope) {
            const h = Math.max(0, Math.min(1, height / CONFIG.MAX_HEIGHT));
            let color;
            if (h < 0.1) color = new THREE.Color(0x001122);
            else if (h < 0.2) {
                const t = (h - 0.1) / 0.1;
                color = new THREE.Color().setRGB(0.8 + 0.2 * t, 0.7 + 0.2 * t, 0.3 + 0.4 * t);
            } else if (h < 0.4) {
                const t = (h - 0.2) / 0.2;
                color = new THREE.Color().setRGB(0.2 + 0.3 * t, 0.6 + 0.2 * t, 0.2 + 0.1 * t);
            } else if (h < 0.6) {
                const t = (h - 0.4) / 0.2;
                color = new THREE.Color().setRGB(0.1 + 0.1 * t, 0.5 - 0.1 * t, 0.1 + 0.1 * t);
            } else if (h < 0.8) {
                const t = (h - 0.6) / 0.2;
                color = new THREE.Color().setRGB(0.4 + 0.2 * t, 0.4 + 0.1 * t, 0.4 - 0.1 * t);
            } else {
                const t = (h - 0.8) / 0.2;
                color = new THREE.Color().setRGB(0.9 - 0.1 * t, 0.9 - 0.05 * t, 0.95 - 0.05 * t);
            }
            const slopeFactor = 1 - Math.min(0.5, slope * 2);
            color.r *= slopeFactor; color.g *= slopeFactor; color.b *= slopeFactor;
            return color;
        }

        class TerrainChunk {
            constructor(x, z, size = CONFIG.CHUNK_SIZE, resolution = 32) {
                this.x = x; this.z = z; this.size = size; this.resolution = resolution;
                this.mesh = null; this.geometry = null;
                this.position = new THREE.Vector3(x * size, 0, z * size);
                this.createMesh();
            }
            createMesh() {
                const planeGeometry = new THREE.PlaneGeometry(this.size, this.size, this.resolution - 1, this.resolution - 1);
                planeGeometry.rotateX(-Math.PI / 2);
                const position = planeGeometry.attributes.position;
                const heightData = [];
                for (let i = 0; i < position.count; i++) {
                    const x = position.getX(i), z = position.getZ(i);
                    const nx = (this.x * this.size + x) * CONFIG.SCALE;
                    const nz = (this.z * this.size + z) * CONFIG.SCALE;
                    let noiseValue = noiseGen.fractalNoise(nx, nz, CONFIG.OCTAVES, CONFIG.PERSISTENCE, CONFIG.LACUNARITY);
                    const height = (noiseValue * 0.5 + 0.5) * CONFIG.MAX_HEIGHT;
                    heightData[i] = height;
                    position.setY(i, height);
                }
                const color = new THREE.Color();
                const colors = [];
                for (let i = 0; i < position.count; i++) {
                    const height = heightData[i];
                    let slope = 0;
                    if (i < position.count - this.resolution) {
                        const nextHeight = heightData[i + this.resolution];
                        slope = Math.max(slope, Math.abs(nextHeight - height) / (this.size / (this.resolution - 1)));
                    }
                    if (i < position.count - 1) {
                        const nextHeight = heightData[i + 1];
                        slope = Math.max(slope, Math.abs(nextHeight - height) / (this.size / (this.resolution - 1)));
                    }
                    color.copy(getHeightColor(height, slope));
                    colors.push(color.r, color.g, color.b);
                }
                planeGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                planeGeometry.computeVertexNormals();
                const material = new THREE.MeshPhongMaterial({
                    vertexColors: THREE.VertexColors, flatShading: true, side: THREE.DoubleSide, wireframe: CONFIG.WIREFRAME
                });
                this.geometry = planeGeometry; this.mesh = new THREE.Mesh(planeGeometry, material);
                this.mesh.position.copy(this.position); this.mesh.castShadow = true; this.mesh.receiveShadow = true;
            }
            updateVisibility(cameraPosition) {
                const distance = this.mesh.position.distanceTo(cameraPosition);
                this.mesh.visible = distance < CONFIG.CHUNK_SIZE * CONFIG.CHUNK_COUNT * 1.5;
            }

            getHeightAt(x, z) {
                const localX = x - this.position.x, localZ = z - this.position.z;
                if (localX < -this.size/2 || localX > this.size/2 || localZ < -this.size/2 || localZ > this.size/2) return null;
                const resolution = this.resolution, segmentSize = this.size / (resolution - 1);
                const segX = Math.floor((localX + this.size/2) / segmentSize);
                const segZ = Math.floor((localZ + this.size/2) / segmentSize);
                const x0 = segX * segmentSize - this.size/2, z0 = segZ * segmentSize - this.size/2;
                const x1 = (segX + 1) * segmentSize - this.size/2, z1 = (segZ + 1) * segmentSize - this.size/2;
                const inFirstTriangle = (localX - x0) / (x1 - x0) + (localZ - z0) / (z1 - z0) < 1;
                const position = this.geometry.attributes.position;
                if (inFirstTriangle) {
                    const idx0 = segX + segZ * resolution, idx1 = (segX + 1) + segZ * resolution, idx2 = segX + (segZ + 1) * resolution;
                    const h0 = position.getY(idx0), h1 = position.getY(idx1), h2 = position.getY(idx2);
                    const u = (localX - x0) / (x1 - x0), v = (localZ - z0) / (z1 - z0);
                    return h0 + (h1 - h0) * u + (h2 - h0) * v;
                } else {
                    const idx1 = (segX + 1) + segZ * resolution, idx2 = segX + (segZ + 1) * resolution, idx3 = (segX + 1) + (segZ + 1) * resolution;
                    const h1 = position.getY(idx1), h2 = position.getY(idx2), h3 = position.getY(idx3);
                    const u = (localX - x1) / (x0 - x1), v = (localZ - z0) / (z1 - z0);
                    return h1 + (h2 - h1) * u + (h3 - h1) * v;
                }
            }
            dispose() {
                if (this.geometry) this.geometry.dispose();
                if (this.mesh) { if (this.mesh.material) this.mesh.material.dispose(); scene.remove(this.mesh); }
            }
        }

        class TerrainManager {
            constructor() { this.chunks = []; this.chunkMap = new Map(); }
            generateChunks(cameraPosition) {
                const centerX = Math.floor(cameraPosition.x / (CONFIG.CHUNK_SIZE * CONFIG.CHUNK_COUNT)) * CONFIG.CHUNK_SIZE * CONFIG.CHUNK_COUNT;
                const centerZ = Math.floor(cameraPosition.z / (CONFIG.CHUNK_SIZE * CONFIG.CHUNK_COUNT)) * CONFIG.CHUNK_SIZE * CONFIG.CHUNK_COUNT;
                for (let x = -CONFIG.CHUNK_COUNT/2; x < CONFIG.CHUNK_COUNT/2; x++) {
                    for (let z = -CONFIG.CHUNK_COUNT/2; z < CONFIG.CHUNK_COUNT/2; z++) {
                        const chunkX = Math.floor((centerX + x * CONFIG.CHUNK_SIZE) / CONFIG.CHUNK_SIZE);
                        const chunkZ = Math.floor((centerZ + z * CONFIG.CHUNK_SIZE) / CONFIG.CHUNK_SIZE);
                        const key = `${chunkX},${chunkZ}`;
                        if (!this.chunkMap.has(key)) {
                            const chunk = new TerrainChunk(chunkX, chunkZ);
                            scene.add(chunk.mesh); this.chunks.push(chunk); this.chunkMap.set(key, chunk);
                        }
                    }
                }
                const cameraChunkX = Math.floor(cameraPosition.x / CONFIG.CHUNK_SIZE);
                const cameraChunkZ = Math.floor(cameraPosition.z / CONFIG.CHUNK_SIZE);
                for (let i = this.chunks.length - 1; i >= 0; i--) {
                    const chunk = this.chunks[i];
                    const dx = Math.abs(chunk.x - cameraChunkX), dz = Math.abs(chunk.z - cameraChunkZ);
                    if (dx > CONFIG.CHUNK_COUNT || dz > CONFIG.CHUNK_COUNT) {
                        const key = `${chunk.x},${chunk.z}`; chunk.dispose(); this.chunks.splice(i, 1); this.chunkMap.delete(key);
                    }
                }
            }
            getHeightAt(x, z) {
                const chunkX = Math.floor(x / CONFIG.CHUNK_SIZE), chunkZ = Math.floor(z / CONFIG.CHUNK_SIZE);
                const key = `${chunkX},${chunkZ}`; const chunk = this.chunkMap.get(key);
                if (chunk) return chunk.getHeightAt(x, z);
                let nearestChunk = null, nearestDist = Infinity;
                for (const c of this.chunks) {
                    const dist = Math.abs(c.x - chunkX) + Math.abs(c.z - chunkZ);
                    if (dist < nearestDist) { nearestDist = dist; nearestChunk = c; }
                }
                if (nearestChunk) return nearestChunk.getHeightAt(x, z);
                return 0;
            }
            update(cameraPosition) {
                this.generateChunks(cameraPosition);
                for (const chunk of this.chunks) chunk.updateVisibility(cameraPosition);
            }
        }

        class Aircraft {
            constructor() {
                this.group = new THREE.Group(); this.createModel(); this.createTrail();
            }
            createModel() {
                const bodyGeometry = new THREE.ConeGeometry(5, 20, 8, 1);
                bodyGeometry.rotateX(Math.PI / 2);
                const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x336699, flatShading: true });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.castShadow = true; body.receiveShadow = true; this.group.add(body);
                const cockpitGeometry = new THREE.SphereGeometry(3, 16, 16);
                const cockpitMaterial = new THREE.MeshPhongMaterial({ color: 0x6699cc, flatShading: true, transparent: true, opacity: 0.8 });
                const cockpit = new THREE.Mesh(cockpitGeometry, cockpitMaterial);
                cockpit.position.set(8, 0, 0); this.group.add(cockpit);
                const wingGeometry = new THREE.BoxGeometry(25, 1, 8);
                const wingMaterial = new THREE.MeshPhongMaterial({ color: 0x4477aa, flatShading: true });
                const wingLeft = new THREE.Mesh(wingGeometry, wingMaterial);
                wingLeft.position.set(0, 0, -4); wingLeft.rotation.z = Math.PI / 4; this.group.add(wingLeft);
                const wingRight = new THREE.Mesh(wingGeometry, wingMaterial);
                wingRight.position.set(0, 0, 4); wingRight.rotation.z = -Math.PI / 4; this.group.add(wingRight);
                const tailGeometry = new THREE.BoxGeometry(6, 1, 4);
                const tail = new THREE.Mesh(tailGeometry, wingMaterial);
                tail.position.set(-12, 0, 0); tail.rotation.y = Math.PI / 4; this.group.add(tail);
                const vertTailGeometry = new THREE.BoxGeometry(2, 6, 1);
                const vertTail = new THREE.Mesh(vertTailGeometry, wingMaterial);
                vertTail.position.set(-15, 0, 0); this.group.add(vertTail);
                const propGeometry = new THREE.BoxGeometry(1, 8, 1);
                const propMaterial = new THREE.MeshPhongMaterial({ color: 0x222222, flatShading: true });
                const propeller = new THREE.Mesh(propGeometry, propMaterial);
                propeller.position.set(12, 0, 0); this.group.add(propeller);
                this.propeller = propeller; this.body = body;
            }
            createTrail() {
                this.trailGroup = new THREE.Group(); this.group.add(this.trailGroup);
                this.trailPoints = []; this.maxTrailLength = 50;
            }
            update(deltaTime) {
                if (this.propeller) this.propeller.rotation.x += deltaTime * 0.1 * aircraftState.throttle;
                if (aircraftState.speed > 0.1) this.addTrailPoint();
                this.updateTrail();
            }
            addTrailPoint() {
                const trailPoint = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.6 })
                );
                trailPoint.position.copy(this.group.position); trailPoint.position.y -= 1;
                this.trailGroup.add(trailPoint);
                this.trailPoints.push({ mesh: trailPoint, life: 1.0 });
                while (this.trailPoints.length > this.maxTrailLength) {
                    const oldPoint = this.trailPoints.shift();
                    this.trailGroup.remove(oldPoint.mesh); oldPoint.mesh.geometry.dispose(); oldPoint.mesh.material.dispose();
                }
            }
            updateTrail() {
                for (let i = 0; i < this.trailPoints.length; i++) {
                    const point = this.trailPoints[i];
                    point.life -= 0.02;
                    point.mesh.scale.set(1, 1, 1).multiplyScalar(point.life * 0.5);
                    point.mesh.material.opacity = point.life * 0.6;
                    if (point.life <= 0) {
                        this.trailGroup.remove(point.mesh); point.mesh.geometry.dispose(); point.mesh.material.dispose();
                        this.trailPoints.splice(i, 1); i--;
                    }
                }
            }
        }

        class HUD {
            constructor() {
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                document.getElementById('hud').appendChild(this.canvas);
                window.addEventListener('resize', () => this.resize());
            }
            resize() {
                const width = window.innerWidth, height = window.innerHeight;
                this.canvas.width = width; this.canvas.height = height;
                this.canvas.style.width = `${width}px`; this.canvas.style.height = `${height}px`;
            }
            draw(aircraftState, timeOfDay) {
                const ctx = this.ctx, width = this.canvas.width, height = this.canvas.height;
                ctx.clearRect(0, 0, width, height);
                ctx.strokeStyle = '#00ff88'; ctx.fillStyle = '#00ff88'; ctx.lineWidth = 2;
                this.drawArtificialHorizon(ctx, width, height, aircraftState);
                this.drawCompass(ctx, width, height, aircraftState);
                this.drawSpeedIndicator(ctx, width, height, aircraftState);
                this.drawAltitudeIndicator(ctx, width, height, aircraftState);
                this.drawThrottleIndicator(ctx, width, height, aircraftState);
                this.drawTimeOfDayIndicator(ctx, width, height, timeOfDay);
                this.drawWireframeIndicator(ctx, width, height);
            }
            drawArtificialHorizon(ctx, width, height, state) {
                const centerX = width / 2, centerY = height / 2, size = Math.min(width, height) * 0.3;
                ctx.save(); ctx.translate(centerX, centerY); ctx.rotate(state.roll);
                const horizonY = state.pitch * size * 0.3;
                ctx.fillStyle = 'rgba(100, 200, 255, 0.3)';
                ctx.beginPath(); ctx.moveTo(-size/2, -size/2); ctx.lineTo(size/2, -size/2);
                ctx.lineTo(size/2, horizonY); ctx.lineTo(-size/2, horizonY); ctx.closePath(); ctx.fill();
                ctx.fillStyle = 'rgba(139, 69, 19, 0.3)';
                ctx.beginPath(); ctx.moveTo(-size/2, horizonY); ctx.lineTo(size/2, horizonY);
                ctx.lineTo(size/2, size/2); ctx.lineTo(-size/2, size/2); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-size/2, horizonY); ctx.lineTo(size/2, horizonY); ctx.stroke();
                ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 1;
                for (let i = -90; i <= 90; i += 10) {
                    const y = (i - state.pitch * 10) * size * 0.03;
                    if (y > -size/2 && y < size/2) {
                        ctx.beginPath(); ctx.moveTo(-size/4, y); ctx.lineTo(size/4, y); ctx.stroke();
                        if (i % 20 === 0) {
                            ctx.fillStyle = '#00ff88'; ctx.font = `${size * 0.08}px Arial`; ctx.textAlign = 'right';
                            ctx.fillText(`${i}`, size/4 + 10, y + 4);
                        }
                    }
                }
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 0, size/2 - 20, 0, Math.PI * 2); ctx.stroke();
                ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-size/4, 0); ctx.lineTo(size/4, 0);
                ctx.moveTo(0, -size/4); ctx.lineTo(0, size/4); ctx.stroke();
                ctx.restore();
            }

            drawCompass(ctx, width, height, state) {
                const centerX = width / 2, centerY = height - 80, radius = 60;
                ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.stroke();
                const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 - Math.PI / 2;
                    const x = centerX + Math.cos(angle) * (radius - 15);
                    const y = centerY + Math.sin(angle) * (radius - 15);
                    ctx.fillStyle = '#00ff88'; ctx.font = '14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(directions[i], x, y);
                }
                const headingAngle = -state.yaw - Math.PI / 2;
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + Math.cos(headingAngle) * (radius - 25), centerY + Math.sin(headingAngle) * (radius - 25));
                ctx.stroke();
                const heading = ((-state.yaw * 180 / Math.PI) % 360 + 360) % 360;
                ctx.fillStyle = '#ffffff'; ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(`${Math.round(heading)}°`, centerX, centerY);
            }
            drawSpeedIndicator(ctx, width, height, state) {
                const x = width - 200, y = height / 2, widthBar = 180, heightBar = 40;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath(); ctx.roundRect(x, y - heightBar/2, widthBar, heightBar, 10); ctx.fill();
                ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(x, y - heightBar/2, widthBar, heightBar, 10); ctx.stroke();
                const maxSpeed = CONFIG.SPEED * CONFIG.BOOST_MULTIPLIER;
                const speedPercent = Math.min(1, state.speed / maxSpeed);
                ctx.fillStyle = 'linear-gradient(to right, #00ff88, #00cc66)';
                ctx.fillRect(x + 10, y - heightBar/2 + 10, (widthBar - 20) * speedPercent, heightBar - 20);
                ctx.fillStyle = '#ffffff'; ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const speedKmh = Math.round(state.speed * 3.6);
                ctx.fillText(`${speedKmh} km/h`, x + widthBar/2, y);
            }
            drawAltitudeIndicator(ctx, width, height, state) {
                const x = width - 200, y = height / 2 - 80, widthBar = 180, heightBar = 40;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath(); ctx.roundRect(x, y - heightBar/2, widthBar, heightBar, 10); ctx.fill();
                ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(x, y - heightBar/2, widthBar, heightBar, 10); ctx.stroke();
                const maxAltitude = CONFIG.MAX_HEIGHT * 2;
                const altitudePercent = Math.min(1, Math.max(0, state.position.y / maxAltitude));
                ctx.fillStyle = 'linear-gradient(to right, #ff4444, #ffff44, #44ff44)';
                ctx.fillRect(x + 10, y - heightBar/2 + 10, (widthBar - 20) * altitudePercent, heightBar - 20);
                ctx.fillStyle = '#ffffff'; ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const altitude = Math.round(state.position.y);
                ctx.fillText(`${altitude} m`, x + widthBar/2, y);
            }
            drawThrottleIndicator(ctx, width, height, state) {
                const x = width - 200, y = height / 2 + 80, widthBar = 180, heightBar = 40;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath(); ctx.roundRect(x, y - heightBar/2, widthBar, heightBar, 10); ctx.fill();
                ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(x, y - heightBar/2, widthBar, heightBar, 10); ctx.stroke();
                ctx.fillStyle = 'linear-gradient(to right, #ff4444, #ffff44, #44ff44)';
                ctx.fillRect(x + 10, y - heightBar/2 + 10, (widthBar - 20) * state.throttle, heightBar - 20);
                ctx.fillStyle = '#ffffff'; ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(`Schub: ${Math.round(state.throttle * 100)}%`, x + widthBar/2, y);
            }
            drawTimeOfDayIndicator(ctx, width, height, timeOfDay) {
                const x = 20, y = height - 50;
                const names = ['Tag', 'Abendrot', 'Nacht'];
                const colors = ['#ffff00', '#ff8844', '#444488'];
                ctx.fillStyle = colors[timeOfDay - 1]; ctx.font = '24px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText(`🌍 ${names[timeOfDay - 1]}`, x, y);
            }
            drawWireframeIndicator(ctx, width, height) {
                const x = 20, y = height - 80;
                const names = ['Normal', 'Wireframe', 'Hybrid'];
                const colors = ['#ffffff', '#00ff88', '#ffff00'];
                ctx.fillStyle = colors[wireframeMode]; ctx.font = '20px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText(`🔲 ${names[wireframeMode]}`, x, y);
            }
        }

        let sunLight, ambientLight, hemisphereLight, skybox;
        function setupLighting() {
            ambientLight = new THREE.AmbientLight(0x404040, CONFIG.AMBIENT_DAY); scene.add(ambientLight);
            hemisphereLight = new THREE.HemisphereLight(CONFIG.DAY_COLOR, 0x000000, 0.6);
            hemisphereLight.position.set(0, 1000, 0); scene.add(hemisphereLight);
            sunLight = new THREE.DirectionalLight(CONFIG.DAY_COLOR, 1);
            sunLight.position.set(1000, 1000, 1000); sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = CONFIG.SHADOW_MAP_SIZE; sunLight.shadow.mapSize.height = CONFIG.SHADOW_MAP_SIZE;
            sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 2000;
            sunLight.shadow.camera.left = -1000; sunLight.shadow.camera.right = 1000;
            sunLight.shadow.camera.top = 1000; sunLight.shadow.camera.bottom = -1000;
            scene.add(sunLight);
        }
        function updateLighting(timeOfDay) {
            switch (timeOfDay) {
                case 1: sunLight.color.setHex(CONFIG.DAY_COLOR); sunLight.intensity = 1.0; ambientLight.intensity = CONFIG.AMBIENT_DAY; hemisphereLight.color.setHex(CONFIG.DAY_COLOR); hemisphereLight.intensity = 0.6; scene.background.setHex(0x88ccff); scene.fog.color.setHex(0x88ccff); break;
                case 2: sunLight.color.setHex(CONFIG.SUNSET_COLOR); sunLight.intensity = 0.6; ambientLight.intensity = CONFIG.AMBIENT_SUNSET; hemisphereLight.color.setHex(CONFIG.SUNSET_COLOR); hemisphereLight.intensity = 0.4; scene.background.setHex(0xff6633); scene.fog.color.setHex(0xff6633); break;
                case 3: sunLight.color.setHex(CONFIG.NIGHT_COLOR); sunLight.intensity = 0.2; ambientLight.intensity = CONFIG.AMBIENT_NIGHT; hemisphereLight.color.setHex(CONFIG.NIGHT_COLOR); hemisphereLight.intensity = 0.1; scene.background.setHex(0x000033); scene.fog.color.setHex(0x000033); break;
            }
        }
        function setupSky() {
            const skyGeometry = new THREE.SphereGeometry(2000, 32, 32);
            const skyMaterial = new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x88ccff });
            skybox = new THREE.Mesh(skyGeometry, skyMaterial); scene.add(skybox);
        }
        function updateSky(timeOfDay) {
            switch (timeOfDay) { case 1: skybox.material.color.setHex(0x88ccff); break; case 2: skybox.material.color.setHex(0xff6633); break; case 3: skybox.material.color.setHex(0x000033); break; }
        }

        function setupControls() {
            document.addEventListener('keydown', (event) => {
                keys[event.code] = true;
                switch (event.code) {
                    case 'KeyG': wireframeMode = (wireframeMode + 1) % 3; updateWireframeMode(); break;
                    case 'Digit1': currentTimeOfDay = 1; updateLighting(1); updateSky(1); break;
                    case 'Digit2': currentTimeOfDay = 2; updateLighting(2); updateSky(2); break;
                    case 'Digit3': currentTimeOfDay = 3; updateLighting(3); updateSky(3); break;
                }
            });
            document.addEventListener('keyup', (event) => { keys[event.code] = false; });
            renderer.domElement.addEventListener('mousedown', (event) => {
                if (!pointerLockActive) { mouse.down = true; mouse.x = event.clientX; mouse.y = event.clientY; }
            });
            document.addEventListener('mousemove', (event) => {
                if (mouse.down && !pointerLockActive) { mouse.dx = event.clientX - mouse.x; mouse.dy = event.clientY - mouse.y; mouse.x = event.clientX; mouse.y = event.clientY; }
            });
            document.addEventListener('mouseup', () => { mouse.down = false; mouse.dx = 0; mouse.dy = 0; });
            renderer.domElement.addEventListener('touchstart', (event) => {
                if (!pointerLockActive) { mouse.down = true; mouse.x = event.touches[0].clientX; mouse.y = event.touches[0].clientY; }
            });
            renderer.domElement.addEventListener('touchmove', (event) => {
                if (mouse.down && !pointerLockActive) { mouse.dx = event.touches[0].clientX - mouse.x; mouse.dy = event.touches[0].clientY - mouse.y; mouse.x = event.touches[0].clientX; mouse.y = event.touches[0].clientY; }
            });
            renderer.domElement.addEventListener('touchend', () => { mouse.down = false; mouse.dx = 0; mouse.dy = 0; });
        }
        function setupPointerLock() {
            const pointerLockButton = document.getElementById('pointerLockButton');
            pointerLockButton.addEventListener('click', () => {
                if (!pointerLockActive) renderer.domElement.requestPointerLock();
                else document.exitPointerLock();
            });
            document.addEventListener('pointerlockchange', () => {
                pointerLockActive = document.pointerLockElement === renderer.domElement;
                pointerLockButton.textContent = pointerLockActive ? 'Verlasse Maussteuerung' : 'Aktiviere Maussteuerung';
                document.body.style.cursor = pointerLockActive ? 'none' : '';
            });
            document.addEventListener('mousemove', (event) => {
                if (pointerLockActive) { mouse.dx = event.movementX; mouse.dy = event.movementY; }
            });
        }

        function updateWireframeMode() {
            for (const chunk of chunks) {
                if (chunk.mesh) {
                    switch (wireframeMode) {
                        case 0: chunk.mesh.material.wireframe = false; chunk.mesh.material.transparent = false; chunk.mesh.material.opacity = 1; break;
                        case 1: chunk.mesh.material.wireframe = true; chunk.mesh.material.transparent = false; chunk.mesh.material.opacity = 1; break;
                        case 2: chunk.mesh.material.wireframe = true; chunk.mesh.material.transparent = true; chunk.mesh.material.opacity = 0.5; break;
                    }
                }
            }
            aircraft.group.traverse((child) => {
                if (child.isMesh && child.material) {
                    switch (wireframeMode) {
                        case 0: child.material.wireframe = false; child.material.transparent = false; child.material.opacity = 1; break;
                        case 1: child.material.wireframe = true; child.material.transparent = false; child.material.opacity = 1; break;
                        case 2: child.material.wireframe = true; child.material.transparent = true; child.material.opacity = 0.5; break;
                    }
                }
            });
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (hudCanvas) hudCanvas.resize();
        }
        function checkCollision(terrainManager) {
            const terrainHeight = terrainManager.getHeightAt(aircraftState.position.x, aircraftState.position.z);
            if (terrainHeight !== null) {
                const collisionHeight = terrainHeight + 5;
                if (aircraftState.position.y < collisionHeight) {
                    aircraftState.velocity.y = Math.abs(aircraftState.velocity.y) * CONFIG.BOUNCE_STRENGTH;
                    aircraftState.position.y = collisionHeight; aircraftState.onGround = true; aircraftState.lastBounce = Date.now();
                    aircraftState.velocity.multiplyScalar(0.5);
                    if (collisionHeight - aircraftState.position.y < CONFIG.WARNING_HEIGHT) showWarning(true);
                } else {
                    aircraftState.onGround = false;
                    if (aircraftState.position.y < terrainHeight + CONFIG.WARNING_HEIGHT) showWarning(true);
                    else showWarning(false);
                }
            }
        }
        function showWarning(show) {
            const warningElement = document.getElementById('warning');
            if (show && !warningActive) { warningElement.style.opacity = '1'; warningActive = true; }
            else if (!show && warningActive) { warningElement.style.opacity = '0'; warningActive = false; }
        }
        function updateWarning() {
            if (warningActive) {
                const warningElement = document.getElementById('warning');
                const now = Date.now();
                if (now - aircraftState.lastBounce < 500) {
                    warningElement.textContent = 'BODENNÄHE'; warningElement.style.color = '#ffaa00';
                    warningElement.style.animation = 'pulse 0.3s ease infinite alternate';
                } else {
                    warningElement.textContent = 'PULL UP'; warningElement.style.color = '#ff0000';
                    warningElement.style.animation = 'pulse 0.5s ease infinite alternate';
                }
            }
        }
        function render() { renderer.render(scene, camera); }

        function init() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000); scene.fog = new THREE.FogExp2(0x000000, 0.0005);
            camera = new THREE.PerspectiveCamera(CONFIG.FOV, window.innerWidth / window.innerHeight, CONFIG.NEAR, CONFIG.FAR);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            window.addEventListener('resize', onWindowResize);
            aircraft = new Aircraft(); aircraft.group.position.copy(aircraftState.position); scene.add(aircraft.group);
            const terrainManager = new TerrainManager(); terrainManager.generateChunks(aircraftState.position);
            setupLighting(); setupSky(); hudCanvas = new HUD(); setupControls(); setupPointerLock();
            setTimeout(() => { document.getElementById('loading').classList.add('hidden'); }, 500);
            let lastTime = 0;
            function animate(currentTime) {
                const deltaTime = currentTime - lastTime; lastTime = currentTime; const dt = deltaTime * 0.001;
                if (pointerLockActive || mouse.down) {
                    aircraftState.yaw -= mouse.dx * CONFIG.ROTATION_SPEED; aircraftState.pitch -= mouse.dy * CONFIG.ROTATION_SPEED;
                    aircraftState.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, aircraftState.pitch)); mouse.dx = 0; mouse.dy = 0;
                }
                if (keys['KeyA']) aircraftState.roll -= CONFIG.ROTATION_SPEED * 2;
                if (keys['KeyD']) aircraftState.roll += CONFIG.ROTATION_SPEED * 2;
                aircraftState.roll *= 0.95;
                let targetThrottle = 0;
                if (keys['KeyW']) targetThrottle += 1; if (keys['KeyS']) targetThrottle -= 1;
                if (keys['ShiftLeft'] || keys['ShiftRight']) targetThrottle *= CONFIG.BOOST_MULTIPLIER;
                aircraftState.throttle = THREE.MathUtils.lerp(aircraftState.throttle, targetThrottle, 0.1);
                const forward = new THREE.Vector3(Math.sin(aircraftState.yaw) * Math.cos(aircraftState.pitch), Math.sin(aircraftState.pitch), Math.cos(aircraftState.yaw) * Math.cos(aircraftState.pitch)).normalize();
                const right = new THREE.Vector3(Math.sin(aircraftState.yaw + Math.PI / 2), 0, Math.cos(aircraftState.yaw + Math.PI / 2)).normalize();
                aircraftState.velocity.y -= CONFIG.GRAVITY * dt * 100;
                const liftForce = CONFIG.LIFT * aircraftState.throttle * Math.cos(aircraftState.pitch);
                aircraftState.velocity.y += liftForce * dt * 100;
                const thrust = CONFIG.SPEED * aircraftState.throttle;
                aircraftState.velocity.add(forward.multiplyScalar(thrust * dt * 100));
                aircraftState.velocity.multiplyScalar(CONFIG.DRAG);
                const rollEffect = CONFIG.ROTATION_SPEED * aircraftState.roll * 0.5;
                aircraftState.velocity.add(right.multiplyScalar(rollEffect * dt * 100));
                aircraftState.position.add(aircraftState.velocity.clone().multiplyScalar(dt * 100));
                aircraftState.speed = aircraftState.velocity.length();
                checkCollision(terrainManager);
                aircraft.group.rotation.set(aircraftState.pitch, aircraftState.yaw, aircraftState.roll);
                aircraft.group.position.copy(aircraftState.position); aircraft.update(deltaTime);
                chunks = terrainManager.chunks; terrainManager.update(aircraftState.position);
                const cameraOffset = new THREE.Vector3(Math.sin(aircraftState.yaw) * -30, 10, Math.cos(aircraftState.yaw) * -30);
                camera.position.copy(aircraftState.position).add(cameraOffset); camera.lookAt(aircraftState.position);
                if (hudCanvas) hudCanvas.draw(aircraftState, currentTimeOfDay); updateWarning(); render();
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        }
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
            this.beginPath(); this.moveTo(x + radius, y); this.lineTo(x + width - radius, y);
            this.quadraticCurveTo(x + width, y, x + width, y + radius); this.lineTo(x + width, y + height - radius);
            this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); this.lineTo(x + radius, y + height);
            this.quadraticCurveTo(x, y + height, x, y + height - radius); this.lineTo(x, y + radius);
            this.quadraticCurveTo(x, y, x + radius, y); this.closePath();
        };
        init();
    </script>
