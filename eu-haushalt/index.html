<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU-Haushalt – Infografik</title>
<style>
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#ff6b6b 0%,#feca57 25%,#48dbfb 55%,#5f27cd 100%);background-attachment:fixed;display:flex;justify-content:center;align-items:flex-start;padding:32px 12px;box-sizing:border-box}
.card{background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:1100px;width:100%;padding:28px;box-sizing:border-box}
h1{margin:0 0 6px;font-size:1.8rem;background:linear-gradient(90deg,#5f27cd,#ee5253);-webkit-background-clip:text;background-clip:text;color:transparent}
.hint{display:inline-block;margin:6px 0 20px;padding:6px 12px;border-radius:999px;background:#fff3cd;color:#8a6d00;font-size:.9rem;font-weight:600}
img{display:block;width:100%;height:auto;border-radius:12px}
.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;justify-content:center}
.btn{text-decoration:none;color:#fff;font-weight:700;padding:12px 22px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.18);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.png{background:linear-gradient(135deg,#10ac84,#1dd1a1)}
.pdf{background:linear-gradient(135deg,#ee5253,#ff9f43)}
.svg{background:linear-gradient(135deg,#341f97,#2e86de)}
</style>
</head>
<body>
<main class="card">
<h1>Der EU-Haushalt – Infografik</h1>
<div class="hint">Privat, nicht zur Veröffentlichung, Stand 15.10.2026</div>
<img src="eu_haushalt.png" alt="Infografik zum EU-Haushalt: Überblick über Einnahmen und Ausgaben der Europäischen Union">
<div class="buttons">
<a class="btn png" href="eu_haushalt.png" download>PNG herunterladen</a>
<a class="btn pdf" href="eu_haushalt.pdf" download>PDF herunterladen</a>
<a class="btn svg" href="eu_haushalt.svg" download>SVG herunterladen</a>
</div>
</main>
</body>
</html>
